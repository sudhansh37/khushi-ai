<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Khushi AI</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171a2e; --panel2:#1e2238; --text:#e8eaf6;
    --muted:#9aa0c3; --accent:#7c5cff; --accent2:#ff6ec7; --user:#2a2f4d;
    --bot:#232746; --border:#2b3050;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1b1f3a 0%,var(--bg) 60%);
    color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 16px rgba(124,92,255,.45)}
  header h1{font-size:17px;margin:0}
  header .sub{font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  .toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
    background:var(--panel);border:1px solid var(--border);padding:6px 10px;border-radius:999px;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent)}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:min(760px,86%);padding:12px 15px;border-radius:16px;line-height:1.55;font-size:15px;
    white-space:pre-wrap;word-wrap:break-word;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .user{align-self:flex-end;background:var(--user);border:1px solid var(--border);border-bottom-right-radius:5px}
  .bot{align-self:flex-start;background:var(--bot);border:1px solid var(--border);border-bottom-left-radius:5px}
  .bot b{color:var(--accent2)}
  .sources{align-self:flex-start;max-width:min(760px,86%);font-size:12px;color:var(--muted)}
  .sources a{color:#a99cff;text-decoration:none}
  .sources a:hover{text-decoration:underline}
  .hint{align-self:center;color:var(--muted);font-size:12.5px;text-align:center;margin-top:6px;line-height:1.7}
  .hint code{background:var(--panel2);padding:2px 6px;border-radius:6px}
  form{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--border);background:var(--panel)}
  textarea{flex:1;resize:none;height:52px;padding:14px 16px;border-radius:14px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:15px;font-family:inherit;outline:none}
  textarea:focus{border-color:var(--accent)}
  button{border:0;border-radius:14px;padding:0 22px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2))}
  button:disabled{opacity:.5;cursor:not-allowed}
  .typing::after{content:"▋";animation:blink 1s steps(2) infinite;color:var(--accent2)}
  @keyframes blink{50%{opacity:0}}
  @media(max-width:600px){.toggle span{display:none}}
</style>
</head>
<body>
  <header>
    <div class="avatar">🌸</div>
    <div>
      <h1>Khushi AI</h1>
      <div class="sub">Fully local · CPU · Hindi / English / Hinglish</div>
    </div>
    <div class="spacer"></div>
    <label class="toggle" title="Search the web before answering">
      <input type="checkbox" id="web" checked /><span>🔎 Web research</span>
    </label>
  </header>

  <div id="chat">
    <div class="msg bot">Namaste! Main <b>Khushi</b> hoon 🌸 Aap Hindi, English ya Hinglish — kisi bhi language mein baat kar sakte hain. Web research on hai, to main taaza jaankari bhi dhoond sakti hoon. Puchiye kya jaanna hai?</div>
  </div>

  <form id="f">
    <textarea id="inp" placeholder="Apna sawaal likhiye… (Hindi / English / Hinglish)"></textarea>
    <button id="send" type="submit">Bhejein</button>
  </form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('f');
const inp = document.getElementById('inp');
const send = document.getElementById('send');
const webToggle = document.getElementById('web');
const history = [];

function add(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if(role === 'bot'){ d.innerHTML = text.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  else d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function addSources(list){
  if(!list || !list.length) return;
  const d = document.createElement('div');
  d.className = 'sources';
  d.innerHTML = '🔗 ' + list.map(s =>
    `<a href="${s.url}" target="_blank" rel="noopener">${(s.title||s.url).slice(0,60)}</a>`
  ).join(' · ');
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  send.disabled = true;
  add('user', text);

  const bubble = add('bot', '');
  bubble.classList.add('typing');

  try{
    const res = await fetch('/chat/stream', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:text, history, use_web: webToggle.checked })
    });

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', headerDone = false, answer = '';

    while(true){
      const {value, done} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      if(!headerDone){
        const i = buf.indexOf('\n---\n');
        if(i === -1) continue;
        try{ const meta = JSON.parse(buf.slice(0,i)); addSources(meta.sources); }catch(_){}
        buf = buf.slice(i+5);
        headerDone = true;
        bubble.classList.remove('typing');
      }
      answer += buf;
      bubble.innerHTML = answer.replace(/&/g,'&amp;').replace(/</g,'&lt;');
      buf = '';
      chat.scrollTop = chat.scrollHeight;
    }

    history.push({role:'user', content:text});
    history.push({role:'assistant', content:answer});
    if(history.length > 12) history.splice(0, history.length - 12);
  }catch(err){
    bubble.classList.remove('typing');
    bubble.textContent = 'Sorry, kuch gadbad ho gayi: ' + err.message;
  }finally{
    send.disabled = false;
    inp.focus();
  }
});

inp.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
});
</script>
</body>
</html>
