<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Khushi AI" />
<title>🌸 Khushi AI</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171a2e; --panel2:#1e2238; --text:#e8eaf6;
    --muted:#9aa0c3; --accent:#7c5cff; --accent2:#ff6ec7; --user:#2a2f4d;
    --bot:#232746; --border:#2b3050; --ok:#3ddc97; --warn:#ffb454;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1b1f3a 0%,var(--bg) 60%);
    color:var(--text);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);
    padding-top:calc(12px + env(safe-area-inset-top))}
  .avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 16px rgba(124,92,255,.45)}
  header h1{font-size:16px;margin:0;line-height:1.15}
  header .sub{font-size:11px;color:var(--muted)}
  .spacer{flex:1}
  select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;
    padding:7px 8px;font-size:12px;max-width:130px}
  #chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;
    -webkit-overflow-scrolling:touch}
  .msg{max-width:88%;padding:11px 14px;border-radius:16px;line-height:1.55;font-size:15px;
    white-space:pre-wrap;word-wrap:break-word;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .user{align-self:flex-end;background:var(--user);border:1px solid var(--border);border-bottom-right-radius:5px}
  .bot{align-self:flex-start;background:var(--bot);border:1px solid var(--border);border-bottom-left-radius:5px}
  .bot b{color:var(--accent2)}
  .sys{align-self:center;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.6;max-width:92%}
  .src{align-self:flex-start;max-width:88%;font-size:11.5px;color:var(--muted)}
  .src a{color:#a99cff;text-decoration:none}
  .typing::after{content:"▋";animation:blink 1s steps(2) infinite;color:var(--accent2)}
  @keyframes blink{50%{opacity:0}}
  footer{border-top:1px solid var(--border);background:var(--panel);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .row{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;height:46px;max-height:120px;padding:12px 14px;border-radius:14px;
    border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:16px;
    font-family:inherit;outline:none}
  textarea:focus{border-color:var(--accent)}
  button{border:0;border-radius:14px;height:46px;padding:0 18px;font-size:15px;font-weight:600;color:#fff;
    cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));flex:0 0 auto}
  button:disabled{opacity:.45;cursor:not-allowed}
  .opts{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .opts label{display:flex;align-items:center;gap:6px}
  .opts input{accent-color:var(--accent);width:16px;height:16px}
  #bar{position:fixed;left:0;right:0;top:0;height:3px;background:transparent;z-index:50}
  #bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .25s}
  #status{font-size:12px;color:var(--warn);text-align:center;margin-top:6px;min-height:16px}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:999px;
    padding:3px 9px;font-size:11px;color:var(--muted);margin:2px 3px 0 0}
</style>
</head>
<body>
  <div id="bar"><i></i></div>

  <header>
    <div class="avatar">🌸</div>
    <div>
      <h1>Khushi AI</h1>
      <div class="sub">On-device · no server · no API key</div>
    </div>
    <div class="spacer"></div>
    <select id="model" title="Model (bigger = smarter but heavier)">
      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC" selected>Qwen 1.5B</option>
      <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen 0.5B (lite)</option>
      <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B</option>
    </select>
  </header>

  <div id="chat">
    <div class="sys">
      Namaste! Main <b style="color:var(--accent2)">Khushi</b> hoon 🌸 Hindi, English ya Hinglish — jis bhasha me likhoge, usi me jawab dungi.
      <br>Model pehli baar load hoga (~1 GB, ek hi baar download hota hai). Neeche <b>“Load model”</b> dabao.
    </div>
  </div>

  <footer>
    <div class="row">
      <textarea id="inp" placeholder="Apna sawaal likhiye…" disabled></textarea>
      <button id="send" disabled>Bhejein</button>
    </div>
    <div class="opts">
      <button id="load" style="height:34px;padding:0 14px;font-size:13px;border-radius:10px">⬇ Load model</button>
      <label><input type="checkbox" id="web" checked /> 🔎 Research</label>
      <span id="dl"></span>
    </div>
    <div id="status"></div>
  </footer>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const chatEl = document.getElementById('chat');
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('send');
const loadBtn = document.getElementById('load');
const modelSel = document.getElementById('model');
const webBox = document.getElementById('web');
const statusEl = document.getElementById('status');
const barFill = document.querySelector('#bar>i');
const dlEl = document.getElementById('dl');

let engine = null;
const history = [];   // [{role, content}]

const SYSTEM_PROMPT = `You are Khushi — a warm, witty and genuinely helpful AI assistant.

Personality:
- Friendly, upbeat and a little playful, like a smart friend who loves to help.
- Clear and concise by default; go deeper only when the user asks for detail.
- Never invent facts, links, names, dates or numbers. If unsure, say so.

Language:
- Always reply in the SAME language and script the user writes in.
- Hindi (Devanagari) -> reply in Hindi. Hinglish (Roman Hindi, e.g. "kaise ho bhai")
  -> reply in natural Hinglish. English -> reply in English.
- Never force a language switch the user did not use.

Using web research:
- If given a "Web research context" block, use it and mention the source in plain
  text (e.g. "Source: Wikipedia") when you rely on it.
- Ignore irrelevant results and never claim you browsed a page you were not given.
- If the context does not answer the question, say so and answer from general
  knowledge, clearly flagged as such.`;

function sys(text){ const d=document.createElement('div'); d.className='sys'; d.innerHTML=text; chatEl.appendChild(d); scroll(); }
function add(role, text){ const d=document.createElement('div'); d.className='msg '+role;
  if(role==='bot'){ d.textContent=text; } else d.textContent=text;
  chatEl.appendChild(d); scroll(); return d; }
function scroll(){ chatEl.scrollTop = chatEl.scrollHeight; }
function setStatus(t, warn){ statusEl.textContent = t||''; statusEl.style.color = warn? 'var(--warn)':'var(--muted)'; }

// ---- Web research: Wikipedia (CORS ok) + DuckDuckGo Instant Answer (CORS ok) ----
async function research(query){
  const parts = [];
  const devanagari = /[\u0900-\u097F]/.test(query);
  const wikiLang = devanagari ? 'hi' : 'en';
  try{
    const s = await fetch(`https://${wikiLang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=3`);
    const sj = await s.json();
    const hits = (sj?.query?.search) || [];
    if(hits.length){
      const t = hits[0].title;
      const r = await fetch(`https://${wikiLang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`);
      const rj = await r.json();
      if(rj.extract) parts.push(`Wikipedia (${wikiLang}) — ${rj.title}: ${rj.extract}`);
    }
  }catch(e){}
  try{
    const d = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
    const dj = await d.json();
    if(dj.AbstractText) parts.push(`DuckDuckGo — ${dj.AbstractText} ${dj.AbstractURL||''}`);
    if(dj.Answer) parts.push(`DuckDuckGo answer — ${dj.Answer}`);
  }catch(e){}
  return parts.join('\n\n');
}

// ------------------------------- model -------------------------------
async function loadModel(){
  if(!('gpu' in navigator)){
    setStatus('⚠️ Ye browser WebGPU support nahi karta. Chrome/Edge (Android) ya Safari 18+ (iOS) try karo.', true);
    return;
  }
  const id = modelSel.value;
  loadBtn.disabled = true; modelSel.disabled = true;
  setStatus('Model load ho raha hai… pehli baar download hoga, sabr rakho 🙂');
  try{
    engine = await webllm.CreateMLCEngine(id, {
      initProgressCallback: (r)=>{
        const pct = Math.round((r.progress||0)*100);
        barFill.style.width = pct + '%';
        dlEl.textContent = pct + '%';
        if(r.text) setStatus(r.text.slice(0,90));
      }
    });
    barFill.style.width = '100%';
    setTimeout(()=>{ barFill.style.width='0'; }, 600);
    dlEl.textContent = '';
    setStatus('✅ Ready! Ab apna sawaal pucho.');
    inp.disabled = false; sendBtn.disabled = false; inp.focus();
    loadBtn.textContent = '✓ Loaded';
  }catch(err){
    setStatus('Load fail: ' + (err?.message||err), true);
    loadBtn.disabled = false; modelSel.disabled = false;
  }
}

// ------------------------------- chat -------------------------------
async function send(){
  const text = inp.value.trim();
  if(!text || !engine) return;
  inp.value=''; inp.style.height='46px';
  add('user', text);
  const bubble = add('bot', '');
  bubble.classList.add('typing');

  let context = '';
  if(webBox.checked){
    setStatus('🔎 Research ho rahi hai…');
    context = await research(text);
    setStatus('');
  }

  const msgs = [{role:'system', content:SYSTEM_PROMPT}, ...history];
  let userContent = text;
  if(context){
    userContent = 'Web research context:\n' + context +
      '\n\n---\nUsing the context above where relevant, answer the question below and mention the source.\n\nUser question: ' + text;
  }
  msgs.push({role:'user', content:userContent});

  let answer = '';
  try{
    const chunks = await engine.chat.completions.create({
      messages: msgs, stream: true, temperature: 0.7, max_tokens: 512, top_p: 0.9
    });
    bubble.classList.remove('typing');
    for await (const c of chunks){
      const piece = c.choices?.[0]?.delta?.content || '';
      if(piece){ answer += piece; bubble.textContent = answer; scroll(); }
    }
    if(context){
      const d=document.createElement('div'); d.className='src';
      d.innerHTML = '<span class="pill">🔎 researched</span>';
      chatEl.appendChild(d); scroll();
    }
  }catch(err){
    bubble.classList.remove('typing');
    bubble.textContent = 'Sorry, kuch gadbad: ' + (err?.message||err);
  }finally{
    history.push({role:'user', content:text});
    history.push({role:'assistant', content:answer});
    if(history.length>10) history.splice(0, history.length-10);
    sendBtn.disabled = false; inp.focus();
  }
}

loadBtn.addEventListener('click', loadModel);
sendBtn.addEventListener('click', send);
inp.addEventListener('input', ()=>{ inp.style.height='46px'; inp.style.height=Math.min(inp.scrollHeight,120)+'px'; });
inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
</script>
</body>
</html>
